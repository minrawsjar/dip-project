[project]
name = "ekyc-dip"
version = "0.1.0"
description = "Multimodal eKYC identity verification with classical DIP stages (DIP course project, topic 029)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<2.3",
    # mediapipe pulls opencv-contrib-python; depending on it directly avoids two cv2 builds clobbering each other.
    "opencv-contrib-python>=4.10",
    "scikit-image>=0.24",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pillow>=10.4",
    "pyyaml>=6.0",
    "pytesseract>=0.3.13",
    "mediapipe>=0.10.14",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
cnn = ["torch>=2.4", "torchvision>=0.19"]
dev = ["pytest>=8.3", "ruff>=0.6", "black>=24.8", "httpx>=0.27"]

[project.scripts]
ekyc = "ekyc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ekyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI File()/Form() defaults are the documented idiom

[tool.black]
line-length = 110
